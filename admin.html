<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin · Write. Listen. Speak.</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <div class="small-title">
      Write · Listen · Speak
    </div>

    <section id="login-screen">

      <h1>Admin</h1>

      <p class="intro">
        Sign in to review submissions.
      </p>

      <input
        id="admin-email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="admin-password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="login-button">
        Sign in
      </button>

      <p class="message" id="login-message"></p>

    </section>


    <section id="admin-screen" class="hidden">

      <div class="admin-heading">

        <div>
          <h1>Moderation</h1>
          <p class="intro">
            Review written answers and voice responses.
          </p>
        </div>

        <button
          class="secondary"
          id="logout-button"
        >
          Sign out
        </button>

      </div>


      <h2>Written answers</h2>

      <div id="answers-area">
        <p>Loading...</p>
      </div>


      <h2>Voice responses</h2>

      <div id="voices-area">
        <p>Loading...</p>
      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>

</body>
</html>
