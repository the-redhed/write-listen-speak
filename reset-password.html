<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Admin Password</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <div class="small-title">
      Write · Listen · Speak
    </div>

    <section>

      <h1>Set your password</h1>

      <p class="intro">
        Choose a password for your admin account.
      </p>

      <input
        id="new-password"
        type="password"
        placeholder="New password"
        style="width:100%;max-width:500px;padding:16px;margin-bottom:20px;"
      >

      <br>

      <button id="save-password">
        Save password
      </button>

      <p class="message" id="reset-message"></p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://hgqujhmyamqfunkyokww.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_3QNt1LfRmiSrVaBUyxqfhw_ksSgSi-8";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    document
      .getElementById("save-password")
      .addEventListener("click", async () => {

        const password =
          document
            .getElementById("new-password")
            .value;

        const message =
          document.getElementById("reset-message");

        if (!password || password.length < 8) {
          message.textContent =
            "Use a password with at least 8 characters.";
          return;
        }

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          console.error(error);
          message.textContent =
            "Something went wrong setting your password.";
          return;
        }

        message.textContent =
          "Password saved. You can now use it to sign in as admin.";
      });
  </script>

</body>
</html>
