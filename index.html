<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Write. Listen. Speak.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: #f5f1eb;
      color: #24211f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(680px, 90%);
      text-align: center;
      padding: 60px 20px;
    }

    .small-title {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 35px;
      opacity: 0.6;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      font-weight: normal;
      line-height: 1;
      margin: 0 0 30px;
    }

    .intro {
      font-size: 20px;
      line-height: 1.6;
      margin: 0 auto 50px;
      max-width: 520px;
    }

    .emotion {
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 18px;
      opacity: 0.6;
    }

    .prompt {
      font-size: 28px;
      line-height: 1.35;
      margin: 0 auto 40px;
      max-width: 600px;
    }

    button {
      border: none;
      padding: 16px 30px;
      font-size: 16px;
      cursor: pointer;
      background: #24211f;
      color: white;
      border-radius: 30px;
    }

    button:hover {
      opacity: 0.8;
    }

    .error {
      font-family: Arial, sans-serif;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <main>

    <div class="small-title">
      Write · Listen · Speak
    </div>

    <h1>
      Be heard.<br>
      Hear someone.
    </h1>

    <p class="intro">
      Every week, one question about something human.
      Share your answer anonymously, then hear another person's.
    </p>

    <div id="prompt-area">
      <p>Loading this week's question...</p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://hgqujhmyamqfunkyokww.supabase.co";

    const SUPABASE_KEY = "sb_publishable_3QNt1LfRmiSrVaBUyxqfhw_ksSgSi-8";

    async function loadPrompt() {
      const promptArea = document.getElementById("prompt-area");

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/prompts?status=eq.active&select=emotion,question&limit=1`,
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          throw new Error("Could not load prompt");
        }

        const prompts = await response.json();

        if (prompts.length === 0) {
          promptArea.innerHTML = `
            <p class="error">
              There isn't an active question right now.
            </p>
          `;
          return;
        }

        const prompt = prompts[0];

        promptArea.innerHTML = `
          <div class="emotion">
            ${escapeHtml(prompt.emotion)}
          </div>

          <p class="prompt">
            ${escapeHtml(prompt.question)}
          </p>

          <button>
            Begin
          </button>
        `;

      } catch (error) {
        console.error(error);

        promptArea.innerHTML = `
          <p class="error">
            Something went wrong loading the question.
          </p>
        `;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadPrompt();
  </script>

</body>
</html>
